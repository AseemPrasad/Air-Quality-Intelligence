# Open-Meteo API Configuration
# Weather data: temperature, humidity, wind, pressure,
# precipitation, and cloud cover.

open_meteo:
  name: "Open-Meteo API"
  source_type: "weather"

  # API endpoint configuration
  base_url: "https://api.open-meteo.com/v1"
  timeout_seconds: 30

  # Authentication
  requires_api_key: false

  # Rate limiting
  rate_limit_per_minute: 60
  max_parallel_requests: 2

  # Retry configuration
  retry_count: 3
  retry_delays_seconds:
    - 2
    - 4
    - 8

  # Transient HTTP status codes
  transient_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

  # Location configuration
  location:
    city: "Kolkata"
    country: "India"
    latitude: 22.5726
    longitude: 88.3639

  # Geographic bounding box
  kolkata_bbox:
    north: 22.65
    south: 22.45
    east: 88.5
    west: 88.2

  # Weather parameters
  weather_params:
    - code: "temperature_2m"
      name: "Temperature (2m)"
      unit: "°C"

    - code: "relative_humidity_2m"
      name: "Relative Humidity (2m)"
      unit: "%"

    - code: "wind_speed_10m"
      name: "Wind Speed (10m)"
      unit: "km/h"

    - code: "wind_direction_10m"
      name: "Wind Direction (10m)"
      unit: "°"

    - code: "pressure_msl"
      name: "Pressure (MSL)"
      unit: "hPa"

    - code: "precipitation"
      name: "Precipitation"
      unit: "mm"

    - code: "cloud_cover"
      name: "Cloud Cover"
      unit: "%"

  # API query options
  options:
    timezone: "Asia/Kolkata"
    temperature_unit: "celsius"
    wind_speed_unit: "kmh"
    precipitation_unit: "mm"
    pressure_unit: "hPa"

  # Data availability
  has_real_time: true
  has_historical: true
  has_forecast: true

  historical_depth_days: 10000
  forecast_depth_days: 16

  # Update frequency
  update_frequency_minutes: 15

   


