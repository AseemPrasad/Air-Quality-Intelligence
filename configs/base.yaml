# Air Quality Intelligence Platform - Base Configuration
# Environment-independent settings.
# Environment-specific configurations can override these defaults.

platform:
  name: "Air Quality Intelligence Platform"
  version: "0.1.0"
  environment: "development"

# Data ingestion and storage settings
data:
  # Lookback window for handling late-arriving records (hours)
  lookback_hours: 6

  # Data partition granularity: daily or hourly
  partition_granularity: "daily"

  # Historical data retention period (days)
  retention_days: 730

# Data quality validation settings
quality:
  # Valid humidity range (percentage)
  humidity_min: 0
  humidity_max: 100

  # Valid wind direction range (degrees)
  wind_direction_min: 0
  wind_direction_max: 360

  # Allowed tolerance for future-dated observations (hours)
  future_date_tolerance_hours: 1

  # Enable duplicate observation detection
  duplicate_check_enabled: true

  # Number of consecutive unchanged observations before flagging
  flatline_threshold_count: 5

# Anomaly detection settings
anomaly:
  # Robust Z-score thresholds for severity classification
  thresholds:
    normal: 2.0
    elevated: 2.0
    high: 3.0
    severe: 4.0
    extreme: 5.0

  # Minimum observations required to calculate a baseline
  min_history_observations: 60

  # Fallback percentile when median absolute deviation is zero
  fallback_percentile: 75

# Pollution event detection settings
pollution_events:
  # Minimum consecutive high-pollution hours
  min_consecutive_high_hours: 3

  # Minimum high-pollution hours within the detection window
  min_high_hours_in_window: 3

  # Event detection window (hours)
  window_hours: 4

  # Merge events separated by this duration or less (hours)
  merge_gap_hours: 1

# Machine learning configuration
ml:
  # Minimum MAE improvement required for model promotion (%)
  min_promotion_improvement_pct: 5.0

  # Default forecast horizons (hours)
  default_forecast_horizons:
    - 1
    - 3
    - 6

  # Dataset split fractions
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2

  # Random seed for reproducibility
  random_seed: 42

# Data storage configuration
storage:
  # Root directories for different data layers
  raw_path: "data/raw"
  clean_path: "data/clean"
  marts_path: "data/marts"
  quarantine_path: "data/quarantine"

  # Parquet storage options
  parquet_compression: "snappy"
  parquet_row_group_size: 10000

# Application logging configuration
logging:
  # Supported levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Include stack traces when exceptions occur
  include_traceback: true
``
 
