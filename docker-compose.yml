version: "3.8"

services:
  # ============================================================================
  # DATABASE (Control Plane)
  # ============================================================================
  postgres:
    image: postgres:15.4-alpine3.18
    container_name: aq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-aq_control}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - aq-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aq-net
    restart: unless-stopped

  # ============================================================================
  # AIRFLOW
  # ============================================================================

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: aq-airflow-init
    environment:
      AIRFLOW_HOME: ${AIRFLOW_HOME:-/airflow}
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /app/logs
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-aqadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aq_control}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
    entrypoint: >
      sh -c "
      airflow db init &&
      airflow users create -r Admin -u admin -e admin@aq.local -f Admin -l User -p admin
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aq-net
    restart: "no"

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: aq-airflow-scheduler
    environment:
      AIRFLOW_HOME: ${AIRFLOW_HOME:-/airflow}
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /app/logs
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-aqadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aq_control}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
    command: airflow scheduler
    volumes:
      - ./dags:/app/dags
      - ./logs:/app/logs
    depends_on:
      - airflow-init
      - postgres
    networks:
      - aq-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check-sla"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: aq-airflow-webserver
    environment:
      AIRFLOW_HOME: ${AIRFLOW_HOME:-/airflow}
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /app/logs
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-aqadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aq_control}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/app/dags
      - ./logs:/app/logs
    depends_on:
      - airflow-scheduler
    networks:
      - aq-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # API SERVICE
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: aq-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aq_control}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aqadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aq_control}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aq-net
    restart: unless-stopped

  # ============================================================================
  # DASHBOARD SERVICE
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: aq-dashboard
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aq_control}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aqadmin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aq_control}
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres
      - api
    networks:
      - aq-net
    restart: unless-stopped

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  aq-net:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  aq-postgres-data:
    driver: local
