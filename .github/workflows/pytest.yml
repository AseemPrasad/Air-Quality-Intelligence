name: Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest and core dependencies
        run: python -m pip install pytest pandas numpy

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/
