name: CI - Lint, Type Check, Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      # =========================================================================
      # 1. Checkout Code
      # =========================================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================================
      # 2. Setup Python
      # =========================================================================
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # =========================================================================
      # 3. Install Dependencies
      # =========================================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # =========================================================================
      # 4. Lint with Ruff
      # =========================================================================
      - name: Lint with ruff
        id: ruff
        continue-on-error: true
        run: |
          echo "Running ruff check..."
          ruff check src tests --output-format=github || true
          ruff check src tests

      # =========================================================================
      # 5. Type Check with mypy
      # =========================================================================
      - name: Type check with mypy
        id: mypy
        continue-on-error: true
        run: |
          echo "Running mypy..."
          mypy src --no-error-summary || true
          mypy src

      # =========================================================================
      # 6. Unit Tests
      # =========================================================================
      - name: Run unit tests
        id: unit-tests
        run: |
          echo "Running unit tests..."
          pytest tests/unit -v --tb=short

      # =========================================================================
      # 7. Integration Tests
      # =========================================================================
      - name: Run integration tests
        id: integration-tests
        continue-on-error: true
        run: |
          echo "Running integration tests..."
          pytest tests/integration -v --tb=short

      # =========================================================================
      # 8. Coverage Report
      # =========================================================================
      - name: Generate coverage report
        id: coverage
        run: |
          echo "Generating coverage report..."
          pytest tests/unit tests/integration \
            --cov=src/aq_engine \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      # =========================================================================
      # 9. Upload Coverage to CodeCov
      # =========================================================================
      - name: Upload coverage to CodeCov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      # =========================================================================
      # 10. Build Docker Images
      # =========================================================================
      - name: Build Docker images
        id: docker-build
        run: |
          echo "Building Docker images..."
          docker-compose build --no-cache

      # =========================================================================
      # 11. Summary
      # =========================================================================
      - name: CI Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff Lint | ${{ steps.ruff.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MyPy Type Check | ${{ steps.mypy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.unit-tests.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ steps.integration-tests.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage (80% min) | ${{ steps.coverage.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ steps.docker-build.outcome }} |" >> $GITHUB_STEP_SUMMARY

      # =========================================================================
      # 12. Fail if any check failed
      # =========================================================================
      - name: Check all required checks passed
        if: failure()
        run: |
          echo "❌ Some CI checks failed"
          exit 1

      - name: All checks passed ✅
        if: success()
        run: |
          echo "✅ All CI checks passed"
