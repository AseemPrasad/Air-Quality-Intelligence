
name: "✨ Feature Request"
description: "Suggest a new feature or enhancement for SecureFlow"
title: "[FEATURE] "
labels:
  - enhancement
  - needs-triage
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request
        Thank you for helping improve SecureFlow!
        Please provide the details below so we can understand your suggestion.

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem Statement"
      description: "What problem or limitation does this feature address?"
      placeholder: "As a user, I face this problem because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 Proposed Solution"
      description: "Explain the feature or improvement you would like."
      placeholder: "I would like SecureFlow to..."
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: "👥 Use Case"
      description: "Who would benefit from this feature and how?"
      placeholder: "This feature would help users who..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternatives Considered"
      description: "Have you considered any alternative solutions or workarounds?"
      placeholder: "Alternative approaches include..."

  - type: dropdown
    id: component
    attributes:
      label: "🧩 Component"
      description: "Which part of SecureFlow would this feature affect?"
      options:
        - API
        - Ingestion
        - Analytics
        - Dashboard
        - Database
        - Docker/Deployment
        - CLI
        - Airflow
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "🚦 Priority"
      description: "How important is this feature?"
      options:
        - Low - Nice to have
        - Medium - Improves workflow
        - High - Important functionality
        - Critical - Blocks essential operations
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: "What should happen for this feature to be considered complete?"
      placeholder: |
        - [ ] Feature works as expected
        - [ ] Existing functionality is not affected
        - [ ] Documentation is updated

  - type: textarea
    id: additional
    attributes:
      label: "📎 Additional Context"
      description: "Add screenshots, mockups, examples, or other relevant information."
      placeholder: "Additional details..."

  - type: checkboxes
    id: checklist
    attributes:
      label: "📋 Checklist"
      options:
        - label: "I have checked that a similar feature request does not already exist."
          required: true
        - label: "I have provided sufficient details about this suggestion."
          required: true
