name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the bug or unexpected behavior.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Open the application
        2. Navigate to '...'
        3. Click on '...'
        4. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should happen.
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happens.
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Add relevant browser console errors or application logs.
      render: shell
      placeholder: Paste logs here...

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the application is affected?
      options:
        - Battle Mode
        - Live Map
        - Authentication
        - Dashboard
        - UI/Accessibility
        - Responsive Layout
        - API
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      description: Version or commit where the issue occurred.
      placeholder: "Latest"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide your system and browser information.
      placeholder: |
        - OS: Windows 11
        - Browser: Google Chrome
        - Browser Version: 154.0
        - Device: Desktop
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add screenshots, videos, links, or any other relevant information.
      placeholder: Add any other context about the problem here...
