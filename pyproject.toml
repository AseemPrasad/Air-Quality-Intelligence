[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aq-engine"
version = "0.1.0"
description = "Air Quality Intelligence Platform - local-first data engineering and analytics system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Air Quality Engineering Team"}
]
dependencies = [
    # Core data processing
    "polars==0.19.19",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "duckdb==0.9.2",

    # Database
    "sqlalchemy==2.0.23",
    "psycopg[binary]==3.1.12",
    "alembic==1.13.1",

    # API
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Orchestration — requires Python <3.12; install with: pip install -e ".[orchestration]"
    # "apache-airflow==2.7.3",
    # "apache-airflow-providers-postgres==5.10.0",

    # Machine Learning
    "scikit-learn==1.3.2",
    "xgboost==2.0.3",

    # UI
    "streamlit==1.29.0",

    # CLI
    "typer[all]==0.9.0",
    # typer 0.9 allows any click<9, but click 8.2 changed Parameter.make_metavar()
    # to take a ctx argument, which typer 0.9 does not pass: `aq --help` crashed.
    "click>=8.0,<8.2",

    # Config & Logging
    "pyyaml==6.0.1",
    "python-json-logger==2.0.7",

    # Utils
    "python-dateutil==2.8.2",
    "requests==2.31.0",
    "rich==13.7.0",
]
[project.scripts]
aq = "aq_engine.cli:cli_app"

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.1.6",
    "mypy==1.7.1",
    "black==23.12.0",
    "pre-commit==3.5.0",
]
orchestration = [
    "apache-airflow==2.7.3",
    "apache-airflow-providers-postgres==5.10.0",
]

[tool.setuptools]
packages = ["aq_engine"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/aq_engine --cov-report=term-missing"